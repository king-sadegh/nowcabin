name: Deploy NoKabin to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Iran VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 35m
          script: |
            set -euo pipefail

            if [ -d /opt/nokabin ]; then
              cd /opt/nokabin
            elif [ -d /root/karami ]; then
              cd /root/karami
            elif [ -d "$HOME/karami" ]; then
              cd "$HOME/karami"
            else
              git clone https://github.com/king-sadegh/nowcabin.git /opt/nokabin
              cd /opt/nokabin
            fi

            git remote set-url origin https://github.com/king-sadegh/nowcabin.git
            git fetch origin main
            git reset --hard origin/main
            echo "=== Melipayamak GetCredit & Server IP Diagnostic ==="
            curl -fsS -X POST https://rest.payamak-panel.com/api/SendSMS/GetCredit \
              -H "Content-Type: application/json" \
              -d '{"username":"989225603574","password":"80c521ed-98e2-49e9-97f9-869c2af8c27c"}' && echo "" || true
            curl -fsS -X POST https://rest.payamak-panel.com/api/SendSMS/GetCredit \
              -H "Content-Type: application/json" \
              -d '{"username":"09225603574","password":"80c521ed-98e2-49e9-97f9-869c2af8c27c"}' && echo "" || true
            curl -fsS -X POST https://rest.payamak-panel.com/api/SendSMS/GetCredit \
              -H "Content-Type: application/json" \
              -d '{"username":"9225603574","password":"80c521ed-98e2-49e9-97f9-869c2af8c27c"}' && echo "" || true
            chmod +x deploy.sh
            bash deploy.sh

            echo "Waiting for health check..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
                echo "Health check passed!"
                docker logs --tail 50 nokabin-app || true
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed!"
            docker logs --tail 50 nokabin-app || true
            exit 1
