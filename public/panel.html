<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل کاربری، مشاورین املاک و مدیریت | نوکابین</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/logo.png" alt="لوگوی نوکابین" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-title">نوکابین</span>
          <span class="brand-sub">سامانه مدیریت و پنل کاربری</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="/">صفحه اصلی</a></li>
        <li><a href="/changes.html">مشاهده تغییرات واقعی</a></li>
        <li><a href="/#inspection">بازدید رایگان</a></li>
      </ul>

      <div class="header-actions">
        <a href="tel:+989225603574" class="phone-quick">
          <i class="fa-solid fa-phone-volume"></i>
          <span class="ltr">+989225603574</span>
        </a>
        <button type="button" class="btn btn-danger btn-sm" id="logoutBtn" style="display: none;">خروج</button>
      </div>
    </div>
  </header>

  <main class="panel-shell">
    <div class="container">
      <!-- Auth View (OTP Test Mode) -->
      <section id="authSection" style="display: none;">
        <div class="card auth-card">
          <div style="text-align: center; margin-bottom: 18px;">
            <img src="/assets/logo.png" alt="نوکابین" style="width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 10px;" />
            <h1 style="font-size: 1.4rem; font-weight: 900;">ورود / ثبت‌نام با کد یک‌بارمصرف (OTP)</h1>
            <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px;">
              سیستم تایید پیامکی در <strong>حالت تستی</strong> فعال است؛ کد OTP پس از درخواست روی صفحه نمایش داده می‌شود.
            </p>
          </div>

          <div class="role-tabs" id="authRoleTabs">
            <button type="button" class="role-tab active" data-role="customer">مشتری</button>
            <button type="button" class="role-tab" data-role="agent">مشاور املاک</button>
            <button type="button" class="role-tab" data-role="admin">مدیریت</button>
          </div>

          <form id="otpRequestForm">
            <div class="field" style="margin-bottom: 14px;">
              <label for="authPhone">شماره همراه *</label>
              <input type="tel" id="authPhone" class="ltr" required placeholder="09123456789" />
            </div>

            <div id="extraRegisterFields" style="display: none;">
              <div class="field" style="margin-bottom: 12px;">
                <label for="authFullName">نام و نام خانوادگی</label>
                <input type="text" id="authFullName" placeholder="نام کامل خود را بنویسید" />
              </div>
              <div id="agentExtraFields" style="display: none;">
                <div class="field" style="margin-bottom: 12px;">
                  <label for="authAgencyName">نام دفتر املاک</label>
                  <input type="text" id="authAgencyName" placeholder="مثال: املاک نیاوران" />
                </div>
                <div class="field" style="margin-bottom: 12px;">
                  <label>پیام‌رسان ارتباطی</label>
                  <div class="messenger-choices">
                    <label class="messenger-option">
                      <input type="radio" name="authMessenger" value="bale" checked />
                      <span class="messenger-card bale">بله</span>
                    </label>
                    <label class="messenger-option">
                      <input type="radio" name="authMessenger" value="whatsapp" />
                      <span class="messenger-card wa">واتس‌اپ</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;" id="requestOtpBtn">
              دریافت کد تایید تستی (OTP)
            </button>
          </form>

          <form id="otpVerifyForm" style="display: none; margin-top: 16px;">
            <div class="info-banner gold" id="testOtpBanner" style="margin-bottom: 14px;"></div>
            <div class="field" style="margin-bottom: 14px;">
              <label for="otpCodeInput">کد تایید ۶ رقمی *</label>
              <input type="text" id="otpCodeInput" class="ltr" maxlength="6" required placeholder="123456" />
            </div>
            <div style="display: flex; gap: 10px;">
              <button type="submit" class="btn btn-gold" style="flex: 1;">تایید و ورود به پنل</button>
              <button type="button" class="btn btn-outline" id="backToPhoneBtn">تغییر شماره</button>
            </div>
          </form>

          <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-light); font-size: 0.82rem; color: var(--text-secondary);">
            <strong>حساب‌های نمونه آماده برای تست سریع:</strong>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;">
              <button type="button" class="btn btn-outline btn-sm" data-demo-phone="09123334455" data-demo-role="customer">مشتری نمونه (09123334455)</button>
              <button type="button" class="btn btn-outline btn-sm" data-demo-phone="09121112233" data-demo-role="agent">مشاور نمونه (09121112233)</button>
              <button type="button" class="btn btn-outline btn-sm" data-demo-phone="09225603574" data-demo-role="admin">مدیر سایت (09225603574)</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Customer Panel -->
      <section id="customerPanel" style="display: none;"></section>

      <!-- Real Estate Agent Panel -->
      <section id="agentPanel" style="display: none;"></section>

      <!-- Admin Panel -->
      <section id="adminPanel" style="display: none;"></section>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/common.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
